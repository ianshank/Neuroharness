[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroharness"
version = "0.1.0"
description = "A fail-closed policy-and-verification harness for LLM agent tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "freezegun>=1.5",
  "jsonschema>=4.20",
  # Upper-bounded on purpose, and not as version hygiene. These two are the
  # *gate* in CI stage 1, and a linter minor release adds rules: `ruff>=0.6`
  # meant the build could go red with no change to the tree, and did - RUF036
  # arrived in 0.16 and fired on a type alias written months earlier. A gate
  # whose rule set moves underneath it is not reproducible, which is the same
  # property NFR-07 asks of a decision. Raise the bound deliberately, read the
  # new rules, fix or ignore each with a reason.
  "ruff>=0.16,<0.17",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuroharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "mutation: executable negative mutation fixture proving a gate blocks (INV-07)",
  "property: property-based invariant test",
]

[tool.coverage.run]
source = ["src/neuroharness"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
# Governance section 3, stage 2. The floor lived only in `ci.yml` as
# `MIN_COVERAGE`, so `pytest --cov` run locally enforced nothing and the first
# place a contributor learned they were under it was a red pull request. That is
# the same argument `ci.yml` already makes for the ruff rule set -- "a gate whose
# rule set is spelled in a workflow file is a gate nobody can reproduce locally"
# -- applied to the one gate it had not been applied to. CI keeps its env var so
# the number is visible where the job is read; the two are checked against each
# other by `tests/unit/test_gate_parity.py`.
fail_under = 90

# --- Lint and type-check (governance section 3, stage 1) ----------------------
#
# The rule set a gate enforces has to live in the repository, or the gate is
# whatever the person who last ran the command happened to type. Both tools were
# named in governance section 3 from the start; neither was declared, neither was
# installed, and mypy had never been run.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# `select` is the blocking set: it is clean at zero and stays that way. A rule
# only ever moves into it, never out of it; widening `ignore` to quiet a finding
# is the change this comment exists to make visible in review.
#
# An earlier version of this comment pointed at a `ratchet` group "below" that
# was never written. A comment naming a mechanism the file does not have is the
# documentation half of the defect this project keeps finding in its code, so it
# is corrected rather than implemented: there is no staging area, and a rule is
# either blocking or absent.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

ignore = [
  # `class X(str, Enum)` is deliberate and load-bearing, not legacy. Members
  # compare equal to their string values, which is what lets a rendered reason
  # code, a mode and a verdict round-trip through JSON and through pydantic
  # without a custom serializer at every site. `StrEnum` changes `__str__` and
  # `__format__`, so UP042's "fix" would silently alter what lands in an
  # evidence record. The record is the thing this system exists to produce.
  "UP042",
  # `__all__` and `__slots__` are grouped by meaning, not alphabetically: a
  # reader of `resolve/__init__.py` should see the seam, then the inputs, then
  # the resolver. Sorting them scatters that.
  "RUF022",
  "RUF023",
]

[tool.ruff.lint.per-file-ignores]
# Tests name what they prove, at length. A fixture table is clearer wide.
"tests/**" = ["E501"]
# B039 guards against a ContextVar default that callers can mutate in place,
# which would leak one decision's correlation ids into the next. `LogContext` is
# `@dataclass(frozen=True, slots=True)` and `bind_context` replaces rather than
# mutates, so there is nothing to mutate. The suggested fix - a `None` default
# initialized by `.set()` - would make every read of an unbound context a
# branch, and an unbound context is the common case at process start.
"src/neuroharness/observability/logging.py" = ["B039"]

[tool.ruff.lint.isort]
known-first-party = ["neuroharness"]

[tool.mypy]
python_version = "3.11"
files = ["src/neuroharness"]
strict = true
# Without the plugin, every `BaseModel` subclass resolves to `Any` and each
# `@field_validator` reads as an untyped decorator, so the models carrying the
# wire contract are the part of the tree `strict` checks least. The plugin also
# type-checks synthesized `__init__` signatures, which is what catches a field
# renamed in one place and constructed by its old name in another.
plugins = ["pydantic.mypy"]
# A module that silently stops being checked is a module that stops being
# type-safe without anybody deciding that.
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true
no_implicit_reexport = true

[tool.pydantic-mypy]
# All three strictness flags. `init_forbid_extra` mirrors the `extra="forbid"`
# every model on the wire path already sets at runtime; `init_typed` stops the
# plugin falling back to `Any` for field annotations.
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
