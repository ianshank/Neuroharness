[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroharness"
version = "0.1.0"
description = "A fail-closed policy-and-verification harness for LLM agent tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "freezegun>=1.5", "jsonschema>=4.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/neuroharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "mutation: executable negative mutation fixture proving a gate blocks (INV-07)",
  "property: property-based invariant test",
]

[tool.coverage.run]
source = ["src/neuroharness"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
