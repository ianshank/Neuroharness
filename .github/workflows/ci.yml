# Quality gates for every pull request (`P0-10`; gate list in
# `docs/sdd/06-delivery-and-governance.md` section 3).
#
# That document specifies twelve blocking stages. This workflow runs the ones
# that have something real to run against the code that exists, and no others.
# A stage added before the thing it checks exists would be a green check
# proving nothing, which is the inversion the evaluation plan's fixture
# lifecycle (section 1a) was written to prevent: it retires the pressure to
# build the real gate. The stages still to come are listed in
# `docs/sdd/07-increment-1-plan.md` with the tasks that own them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Governance section 3, stage 2. The trusted computing base must stay at or
  # above this; the suite currently sits near 99%, so a drop of this size is a
  # deliberate act rather than drift.
  MIN_COVERAGE: "90"

jobs:
  # Stage 1 of the twelve in `06-delivery-and-governance.md` section 3. It was
  # specified from the start and had never run: neither tool was declared in
  # pyproject, neither was installed, and `mypy` had never been run on seven of
  # the twelve packages. So the rule set the gate enforced was whatever the last
  # person to type the command happened to choose.
  #
  # Both are clean at zero. That is not a coincidence about tidiness: enabling
  # pydantic's mypy plugin took 48 errors to 4, and one of the four was a real
  # defect the suite could not see - `ResourceKeyRegistry.validate` shadowing
  # `BaseModel.validate`, same name, opposite meanings, no error at either end.
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # Configuration lives in `pyproject.toml`, not in these arguments: a gate
      # whose rule set is spelled in a workflow file is a gate nobody can
      # reproduce locally.
      - name: ruff
        run: python -m ruff check src tests

      # No `ruff format --check` here yet, deliberately. It would reformat 50 of
      # 85 files, and a diff that size landing alongside the increment's repairs
      # would bury them in review - the opposite of what a gate is for. Adopting
      # the formatter is its own change, on a quiet tree, and it belongs with
      # the pre-commit rollout rather than here.
      #
      # `Regal` is the third tool governance section 3 names for this stage. It
      # lints Rego, there is no `policy/` directory, and a linter with nothing to
      # lint is a green check that proves nothing. It lands with `P1-15`.

      # `python -m mypy`, not `mypy`: the plugin has to load from the same
      # interpreter that has pydantic installed. Run any other way, every
      # BaseModel subclass resolves to `Any` and the models carrying the wire
      # contract become the part of the tree `--strict` checks least.
      - name: mypy --strict
        run: python -m mypy

  tests:
    name: Unit tests and coverage (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the package declares, and the next release. A harness whose
        # digests or canonical form differed between interpreters would be a
        # harness whose evidence could not be replayed on another machine.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Unit tests with coverage
        run: >-
          python -m pytest
          --cov=neuroharness
          --cov-branch
          --cov-fail-under=${{ env.MIN_COVERAGE }}
          --cov-report=term-missing

  mutation-fixtures:
    name: Negative mutation fixtures
    runs-on: ubuntu-latest
    # Governance section 3, stage 4: "No manual override exists for this
    # stage." It is a separate job so that a red mutation stage cannot be read
    # as an incidental failure of the unit-test job, and so the constitutional
    # claim it enforces -- Article III, a gate without a killing fixture does
    # not exist -- is visible by name in the checks list.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Every active fixture kills its gate
        run: python -m pytest -m mutation

      - name: The fixture catalogue, declarations and plan agree
        # The other half of stage 4: not only that the fixtures pass, but that
        # every catalogued identifier is declared, every `active` or `partial`
        # declaration is exercised by a marked test, and no test claims to kill
        # a fixture whose gate nobody has built.
        run: python -m pytest tests/unit/test_mutation_fixtures.py

  schema-conformance:
    name: Schema conformance
    runs-on: ubuntu-latest
    # Governance section 3, stage 10. The JSON Schemas in `docs/sdd/schemas/`
    # are the authoritative wire contract and the models are one implementation
    # of it; two implementations of one contract drift silently unless
    # something checks them against each other in both directions.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Models and schemas agree in both directions
        run: python -m pytest tests/unit/test_schema_conformance.py tests/unit/test_schema_versions.py

      - name: Published schemas are valid JSON Schema
        run: |
          python - <<'PY'
          import json
          import pathlib
          from jsonschema import Draft202012Validator

          for path in sorted(pathlib.Path("docs/sdd/schemas").glob("*.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"ok  {path}")
          PY

  no-magic-values:
    name: No unnamed governing values
    runs-on: ubuntu-latest
    # Not one of the twelve, and deliberately its own check. A threshold or a
    # domain string written as a literal in a code path is a policy decision
    # nobody reviewed, which is the defect `T-17` describes; the scanner that
    # prevents it is worth failing by name rather than inside a test run.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Governing values are named constants
        run: >-
          python -m pytest
          tests/unit/test_no_magic_values.py
          tests/unit/test_constitutional_constants.py

  hard-rules-have-fixtures:
    # The display name says "register" and not the property, for the reason the
    # comment below gives: a green check reading "hard rules have fixtures" is
    # the false claim itself.
    name: Hard-rule fixture register (known gaps counted)
    runs-on: ubuntu-latest
    # Governance section 3, stage 4, second half: "a check that every hard
    # registry rule has an active fixture". The `mutation-fixtures` job above is
    # the first half; this is the one that was specified and never written.
    #
    # The job is named for what it checks and not for Article IV on purpose. The
    # property Article IV states -- every hard gate ships with a killing fixture
    # -- is false for every rule the register lists, so a green check called
    # "Article IV" would be a tick beside a false sentence, and a tick is what
    # stops the gate being built. Instead the
    # shortfall lives in a checked-in, shrink-only register and this job prints
    # the count it holds, so green reads as "the register is consistent" and
    # never as "the constitution is satisfied".
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Known gaps in hard-rule fixture coverage
        # Printed before the check runs, and into the run summary, so the number
        # is visible to somebody reading the checks list rather than only to
        # somebody who opens the register. A stage that reports "pass" while
        # hard gates have no killing fixture has to say so out loud.
        run: |
          python - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          import json
          import pathlib

          register = json.loads(
              pathlib.Path("tests/fixtures/hard_rule_gaps.json").read_text(encoding="utf-8")
          )
          count = register["gap_count"]
          print(f"hard-rules-have-fixtures: {count} known gaps")
          for entry in register["gaps"]:
              print(
                  f"  {entry['critic_id']} ({entry['action_class']})"
                  f" -> {entry['source_requirement']}, owed by {entry['owed_by']}"
              )
          PY

      - name: Every hard enforcing rule is covered or on the register
        run: python -m pytest tests/unit/test_hard_rule_fixtures.py

  docs:
    name: "Docs: spec IDs, ADR index and scenario register"
    runs-on: ubuntu-latest
    # Governance section 3, stage 11. All three checks answer the same question
    # from different directions: does an identifier written down somewhere still
    # name the thing it claims to name? A test citing a renamed requirement, an
    # index row for a decision record nobody wrote, and a scenario the
    # specification accepts nothing against are the same defect -- a citation
    # that outlived its referent -- and each of them fails silently, because the
    # document and the test both still read correctly on their own.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Every identifier the code cites exists in the SDD package
        run: python -m pytest tests/unit/test_spec_id_consistency.py

      - name: The ADR index and the ADR files agree
        run: python -m pytest tests/unit/test_adr_index.py

      - name: Every acceptance scenario is declared and its claims hold
        # Article VII asks which scenario accepts a change. Forty-five are
        # specified and three are executed; the register makes that a number
        # instead of an impression, and fails if a declaration names a test that
        # does not name the scenario back.
        run: python -m pytest tests/unit/test_scenario_coverage.py

  security:
    name: Security (secrets and dependencies)
    runs-on: ubuntu-latest
    # Governance section 3, stage 9, and only the part that needs no
    # repository-admin settings: CodeQL default setup and Trivy on images are
    # deferred with their reason in `docs/sdd/08-increment-2-plan.md` section
    # 4.3, so the deferral is a decision rather than an omission.
    #
    # Both checks are cheapest now and get harder every week. The repository
    # guards a signer abstraction and key-id handling by constitution
    # (`NFR-17`), so a committed secret is a constitutional failure and not only
    # an incident; and a trusted computing base with one runtime dependency is
    # the easiest dependency surface this project will ever audit.
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks reads history, not the working tree. A secret that was
          # committed and then removed is still a secret that was published,
          # and a shallow clone would report the repository clean.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gitleaks
        # The released binary rather than the marketplace action: the action
        # requires an organization licence key, and a scan that cannot run
        # without a secret is a scan that will eventually be quietly disabled.
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: No secrets in the tree or its history
        # `--redact` so a finding does not republish the secret in a public log,
        # which is the classic way a leak detector becomes a leak.
        run: gitleaks detect --source . --redact --no-banner --verbose

      - name: Install pip-audit
        run: python -m pip install --upgrade pip && python -m pip install pip-audit

      - name: No known vulnerabilities in the dependency set
        # Audits the project's declared dependencies rather than whatever the
        # runner happens to have installed, so the result describes the trusted
        # computing base and not the CI image. `--strict` fails on a dependency
        # pip-audit cannot resolve: an unaudited dependency reported as a pass
        # is the failure mode this stage exists to prevent.
        run: pip-audit --strict --progress-spinner=off .
