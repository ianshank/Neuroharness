# Local ratchets, so a finding is caught before it is pushed rather than after.
#
# These mirror CI stage 1 (`06-delivery-and-governance.md` section 3) exactly.
# A hook that is stricter than CI trains people to skip hooks; a hook that is
# looser makes CI the first place a finding appears, which is the slow loop this
# file exists to close.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Held to the same range as `pyproject.toml`'s dev dependency, which is what
    # CI installs. A linter minor release adds rules, so a hook pinned older
    # than the gate passes locally and fails in CI on an unchanged tree - the
    # slow loop this file exists to close, arriving as a build that goes red
    # with nobody having touched it.
    rev: v0.16.8
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
      # No `ruff-format` hook. It is not in CI stage 1 either, and for the same
      # recorded reason: `ruff format` would rewrite 53 of the 134 files in the
      # tree, so the hook fails on every commit until somebody reformats. A
      # blocking hook that is always red is a hook people pass `--no-verify`
      # past, and the habit does not stay confined to that one hook.
      #
      # Whether this project adopts `ruff format` is a real choice with a
      # 53-file diff behind it, and it belongs in a change of its own where the
      # diff is the whole review rather than buried in one.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # An evidence export is JSONL. A file whose last line has no newline
      # produces a truncated final record when concatenated, which is the
      # SEC-10 shape: the chain verifies and the last decision is gone.
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # A malformed fixture is a fixture that silently stops testing its gate.
      - id: check-json
      - id: check-yaml
      - id: check-toml
      # The constitution forbids secrets in fixtures; this is the cheap half.
      - id: detect-private-key
      # A merge conflict marker in a signed registry is a registry that fails
      # to parse at load, i.e. a fail-closed outage discovered in production.
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Not the ruff-pre-commit mirror: mypy needs the project's own
      # dependencies importable to see pydantic's plugin, and an isolated
      # pre-commit environment does not have them. Running it from the working
      # environment is the only way the plugin loads, and without the plugin
      # every BaseModel subclass reads as `Any` - which is how 44 of the 48
      # errors this config found had stayed invisible.
      - id: mypy
        name: mypy (strict, with the pydantic plugin)
        entry: python3 -m mypy
        language: system
        types: [python]
        pass_filenames: false
